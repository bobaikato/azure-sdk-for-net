version: 1
metadata:
  ota:
    minimum_version: "1.6.24"
project:
  name: azure-sdk-for-net
  type: library
  description: Narrow Azure.Core restore and build proof with repository-owned NuGet feed truth
toolchains:
  dotnet:
    version: "10.0.103"
execution:
  default_context: dotnet:container
  contexts:
    dotnet:native:
      backend: native
    dotnet:container:
      backend: container
      lifecycle: ephemeral
      container:
        image: mcr.microsoft.com/dotnet/sdk:10.0.103
      attachments:
        # Ota owns the package cache across ephemeral restore/build containers.
        isolated_paths:
          - .nuget/packages
tasks:
  setup:
    description: Restore Azure.Core dependencies through the repository NuGet configuration
    context: dotnet:container
    execution:
      default_mode: container
      modes:
        native:
          context: dotnet:native
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: dotnet_restore
        cwd: sdk/core/Azure.Core/src
        config_file: ../../../../NuGet.Config
    requirements:
      toolchains:
        - dotnet
    effects:
      writes:
        - sdk/core/Azure.Core/src/obj
      network: true
      network_kind: dependency_hydration
  build:
    description: Build the Azure.Core library from restored dependencies
    context: dotnet:container
    execution:
      default_mode: container
      modes:
        native:
          context: dotnet:native
    depends_on:
      - setup
    command:
      exe: dotnet
      args:
        - build
        - --no-restore
        - --framework
        - net10.0
      cwd: sdk/core/Azure.Core/src
    requirements:
      toolchains:
        - dotnet
    effects:
      writes:
        - artifacts
        - sdk/core/Azure.Core/src/bin
        - sdk/core/Azure.Core/src/obj
workflows:
  default: azure-core
  azure-core:
    intent: verification
    description: Narrow Azure.Core restore and no-restore build proof
    setup:
      task: setup
    run:
      task: build
agent:
  entrypoint: build
  default_task: build
  verify_after_changes:
    - build
  writable_paths:
    - artifacts
    - sdk/core/Azure.Core/src/bin
    - sdk/core/Azure.Core/src/obj
  protected_paths:
    - eng
    - NuGet.Config
  bootstrap:
    ota:
      source:
        kind: branch
        branch: 1.6.24-implementation
