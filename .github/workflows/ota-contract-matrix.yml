name: "Test: Ota contract matrix"

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: "1"

jobs:
  contract:
    name: Ota Contract Matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-native
            os: ubuntu-latest
            mode: native
            setup_dotnet: true
          - name: macos-native
            os: macos-latest
            mode: native
            setup_dotnet: true
          - name: windows-native
            os: windows-latest
            mode: native
            setup_dotnet: true
          - name: ubuntu-container
            os: ubuntu-latest
            mode: container
            setup_dotnet: false

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET SDK
        if: ${{ matrix.setup_dotnet }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Ota from contract truth
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml

      - name: Verify released Ota and selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          ota --version | tee ota-version.txt
          grep -Fq 'ota v1.6.25' ota-version.txt
          if [ "${{ matrix.setup_dotnet }}" = "true" ]; then
            dotnet --version
          fi

      - name: Validate contract
        shell: bash
        run: |
          ota validate --json . > ota-validate.json
          ota validate .

      - name: Inspect task and agent surfaces
        shell: bash
        run: |
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --unsafe --use .
          ota workflows .

      - name: Doctor selected mode
        shell: bash
        run: |
          ota doctor --mode "${{ matrix.mode }}" --json . > ota-doctor.json
          ota doctor --mode "${{ matrix.mode }}" .

      - name: Dry-run task and workflow paths
        shell: bash
        run: |
          ota run setup --mode "${{ matrix.mode }}" --dry-run --json .
          ota run build --mode "${{ matrix.mode }}" --dry-run --json .
          ota up --workflow azure-core --mode "${{ matrix.mode }}" --dry-run --json .

      - name: Execute typed restore
        shell: bash
        run: ota run setup --mode "${{ matrix.mode }}" --stream .

      - name: Execute no-restore build
        shell: bash
        run: ota run build --mode "${{ matrix.mode }}" --stream .

      - name: Execute declared verification workflow
        shell: bash
        run: ota up --workflow azure-core --mode "${{ matrix.mode }}" --stream .

      - name: Upload Ota evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          retention-days: 7
          path: |
            ota-version.txt
            ota-validate.json
            ota-doctor.json
            .ota/ci/
            .ota/contracts/
            .ota/receipts/
            .ota/proof/
